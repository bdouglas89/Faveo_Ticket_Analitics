services:
  faveo-tickets-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faveo_tickets_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=cambiar_esta_clave_secreta_jwt_en_produccion
    volumes:
      # Persistir la base de datos SQLite y los logs de errores
      - ./tickets.db:/app/tickets.db
      - ./logs:/app/logs
    restart: unless-stopped

  sqlite-web:
    image: coleifer/sqlite-web
    container_name: faveo_sqlite_web
    ports:
      - "8080:8080"
    volumes:
      - ./tickets.db:/db/tickets.db
    command: sqlite_web -H 0.0.0.0 -p 8080 /db/tickets.db
    restart: unless-stopped
